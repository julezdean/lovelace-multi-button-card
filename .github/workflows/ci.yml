name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release flow tags only after CI is green, so it has to be possible to
  # run this on demand rather than waiting for an unrelated push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tests plus the version and identity checks -- the same command used
      # locally, so a green CI means the same thing as a green working copy.
      # Every test file imports the card, so a file that stops parsing fails
      # here too; it needs no separate step.
      - run: npm test
