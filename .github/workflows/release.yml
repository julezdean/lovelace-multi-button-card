name: Release

# Runs after `gh release create`, which is the last step of the release flow.
# There is no build, so the card is already in the tag -- this verifies that
# what the tag carries actually says what the tag claims, and attaches the file
# so HACS finds it as a release asset (hacs/integration, repositories/plugin.py).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag is spent once pushed, so the mismatch has to be caught here
      # rather than after someone installs the wrong version.
      - name: Tag and package version must agree
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag_version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $tag says $tag_version, package.json says $pkg_version."
            exit 1
          fi
          echo "Version $pkg_version"

      - run: npm test

      # Proves the version reached the card itself, not just the manifest: the
      # card logs it at load time and that string is how anyone diagnoses which
      # copy a browser is actually running.
      - name: The version must be inside the card
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          card="$(node -p "require('./package.json').main")"
          if ! grep -q "CARD_VERSION = '$pkg_version'" "$card"; then
            echo "::error::$card does not declare CARD_VERSION $pkg_version."
            exit 1
          fi
          echo "$card carries $pkg_version"

      - name: Attach the card to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          card="$(node -p "require('./package.json').main")"
          gh release upload "${{ github.event.release.tag_name }}" \
            "$card" --clobber
